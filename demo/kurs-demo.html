<title>Kurs конвертер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: single column "banknote ticket" up top, then tiles and a cross-rate matrix. */
/* Soft UI: the converter is raised out of the page with a light/dark shadow pair,
   its inputs are pressed in. Everything else stays flat with hairline borders. */
:root {
  --paper: #e3e7ed;
  --surface: #edf0f4;
  --ink: #1d2733;
  --muted: #6a7686;
  --line: #d3d9e1;
  --accent: #0d7a68;
  --accent-ink: #f2fbf7;
  --guilloche: #7d8ea6;
  --up: #1d7a46;
  --down: #b4322a;
  --rub: #2d5ca8;
  --usd: #5f7a1f;
  --idr: #c23b2e;
  --btc: #d9811a;
  --eth: #5a63c4;
  --hi: rgba(255, 255, 255, 0.9);
  --lo: rgba(150, 164, 186, 0.6);
  --convex-a: #e9edf2;
  --convex-b: #dce1e8;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --raised: -14px -14px 32px var(--hi), 14px 14px 32px var(--lo), inset 1px 1px 0 var(--edge);
  --edge: rgba(255, 255, 255, 0.7);
  --raised-sm: -3px -3px 8px var(--hi), 4px 4px 9px var(--lo);
  --pressed: inset 4px 4px 10px var(--lo), inset -4px -4px 10px var(--hi);
  --pressed-sm: inset 2px 2px 5px var(--lo), inset -2px -2px 5px var(--hi);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1e23; --surface: #202429; --ink: #e7eaee; --muted: #9aa3ae; --line: #2d3239;
    --accent: #45c4a8; --accent-ink: #08201a; --guilloche: #8a96a8; --up: #4cc47f; --down: #f07a6e;
    --rub: #7aa3f0; --usd: #b6cf6a; --idr: #f07e6f; --btc: #f3a849; --eth: #9aa2f5;
    --hi: rgba(255, 255, 255, 0.045); --lo: rgba(0, 0, 0, 0.55);
    --convex-a: #22262c; --convex-b: #17191d; --edge: rgba(255, 255, 255, 0.05);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1e23; --surface: #202429; --ink: #e7eaee; --muted: #9aa3ae; --line: #2d3239;
  --accent: #45c4a8; --accent-ink: #08201a; --guilloche: #8a96a8; --up: #4cc47f; --down: #f07a6e;
  --rub: #7aa3f0; --usd: #b6cf6a; --idr: #f07e6f; --btc: #f3a849; --eth: #9aa2f5;
  --hi: rgba(255, 255, 255, 0.045); --lo: rgba(0, 0, 0, 0.55);
  --convex-a: #22262c; --convex-b: #17191d; --edge: rgba(255, 255, 255, 0.05);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page {
  max-width: 920px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 40px;
  display: grid;
  gap: 32px;
}
/* let wide children (the matrix) scroll inside their own box instead of widening the page */
.page > * { min-width: 0; }

/* Masthead */
.masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand__mark {
  font-family: var(--font-num); font-weight: 600; font-size: 15px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--paper); color: var(--accent); box-shadow: var(--raised-sm);
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand__sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.status { display: flex; align-items: center; gap: 10px; }

.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--paper); box-shadow: var(--pressed-sm);
}
.pill__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill--live { color: var(--up); }
.pill--live .pill__dot { animation: pulse 2s ease-in-out infinite; }
.pill--demo, .pill--stale, .pill--day, .pill--unknown { color: var(--btc); }
.pill--err { color: var(--down); }
@keyframes pulse { 50% { opacity: 0.3; } }

.theme-switch {
  display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px;
  background: var(--paper); box-shadow: var(--pressed-sm);
}
.theme-switch button {
  width: 30px; height: 30px; border: 0; border-radius: 50%;
  display: grid; place-items: center; padding: 0;
  background: transparent; color: var(--muted);
  transition: box-shadow 0.15s, color 0.15s;
}
.theme-switch button:hover { color: var(--ink); }
.theme-switch button[aria-checked="true"] { background: var(--paper); color: var(--accent); box-shadow: var(--raised-sm); }

.btn-ghost {
  padding: 8px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
  background: var(--paper); border: 0; box-shadow: var(--raised-sm);
  transition: box-shadow 0.15s, color 0.15s;
}
.btn-ghost:hover:not(:disabled) { color: var(--accent); }
.btn-ghost:active:not(:disabled) { box-shadow: var(--pressed-sm); }
.btn-ghost:disabled { opacity: 0.6; cursor: progress; }

/* Ticket: the one raised object on the page */
.ticket {
  position: relative; overflow: hidden;
  display: grid; gap: 20px;
  padding: 30px 30px 22px;
  background: linear-gradient(145deg, var(--convex-a), var(--convex-b));
  border-radius: 28px;
  box-shadow: var(--raised);
}
.guilloche {
  position: absolute; inset: 0; width: 100%; height: 100%;
  color: var(--guilloche); opacity: 0.1; pointer-events: none;
}
.ticket__row { position: relative; display: grid; gap: 12px; }
.label {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
}

.picker { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  --c: var(--accent);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 999px;
  font-family: var(--font-num); font-size: 13px; font-weight: 600; color: var(--muted);
  background: var(--paper); border: 0; box-shadow: var(--raised-sm);
  transition: box-shadow 0.15s, color 0.15s;
}
.chip__sign { color: var(--c); }
.chip:hover { color: var(--ink); }
.chip[aria-checked="true"] { box-shadow: var(--pressed-sm); color: var(--c); }
.chip--rub { --c: var(--rub); } .chip--usd { --c: var(--usd); } .chip--idr { --c: var(--idr); }
.chip--btc { --c: var(--btc); } .chip--eth { --c: var(--eth); }

.amount, .result {
  display: flex; align-items: baseline; gap: 12px; min-width: 0;
  padding: 12px 18px; border-radius: 18px;
  background: var(--paper); box-shadow: var(--pressed);
}
.amount:focus-within { box-shadow: var(--pressed), 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.amount input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font-family: var(--font-num); font-size: clamp(26px, 6vw, 38px); font-weight: 600;
  font-variant-numeric: tabular-nums; padding: 0;
}
.amount input:focus { outline: none; }
.result__value {
  flex: 1; min-width: 0; overflow-wrap: anywhere;
  font-family: var(--font-num); font-size: clamp(26px, 6vw, 38px); font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--accent);
}
/* code + optional sats stacked; shorter than the number's line box, so the field keeps its height */
.result { align-items: center; }
.result__side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; line-height: 1.1; }
.result__sats {
  font-family: var(--font-num); font-size: 11px; color: var(--muted);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.amount__code { font-family: var(--font-display); font-size: 14px; font-weight: 500; color: var(--muted); }

.swap {
  position: relative; justify-self: start;
  width: 46px; height: 46px; border-radius: 50%;
  border: 0; background: var(--paper); font-size: 20px; color: var(--muted);
  box-shadow: var(--raised-sm);
  transition: box-shadow 0.15s, color 0.15s;
}
/* rotate only the arrow so the light/shadow pair stays put */
.swap span { display: inline-block; transition: transform 0.25s; }
.swap:hover { color: var(--accent); }
.swap:hover span { transform: rotate(180deg); }
.swap:active { box-shadow: var(--pressed-sm); }

.ticket__foot {
  position: relative;
  /* grid, not wrapping flex: a long BTC number must not add a line and
     push everything below it down when the currency changes */
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 22px;
  padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}

/* Click-to-copy numbers. :where() keeps specificity at zero so .tile etc. keep their own box. */
:where(.copy) {
  font: inherit; color: inherit; text-align: inherit;
  background: none; border: 0; margin: -2px -5px; padding: 2px 5px; border-radius: 6px;
  cursor: copy; transition: background 0.15s;
}
.copy:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.copy[data-copied] { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.ticket__foot .rate { font-family: var(--font-num); color: var(--ink); font-weight: 600; margin: -2px 0; padding: 2px 4px; }
.result .copy { margin: 0 -6px; padding: 0 6px; }
.tile.copy { margin: 0; cursor: copy; }
.tile[data-copied] { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); background: color-mix(in srgb, var(--c) 7%, transparent); }
.hint.copy-hint { margin: -8px 0 12px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px);
  padding: 9px 16px; border-radius: 999px;
  background: var(--ink); color: var(--surface);
  font-size: 13px; box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.5);
  animation: toast-in 0.18s ease-out;
}
.toast b { font-family: var(--font-num); }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }

.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint--err { color: var(--down); }

/* Sections */
.section-h {
  font-family: var(--font-display); font-weight: 500; font-size: 16px;
  margin: 0 0 14px; text-wrap: balance;
}
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile {
  --c: var(--accent);
  display: grid; gap: 4px; text-align: left; min-width: 0;
  padding: 14px 16px; border-radius: 16px;
  background: transparent; border: 1px solid var(--line);
  transition: border-color 0.15s, background 0.15s;
}
.tile:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.tile__code { font-family: var(--font-num); font-size: 12px; font-weight: 600; color: var(--c); letter-spacing: 0.04em; }
.tile__value { font-family: var(--font-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile__name { font-size: 12px; color: var(--muted); }
.tile--rub { --c: var(--rub); } .tile--usd { --c: var(--usd); } .tile--idr { --c: var(--idr); }
.tile--btc { --c: var(--btc); } .tile--eth { --c: var(--eth); }

.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; }
.matrix { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 660px; }
.matrix th, .matrix td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.matrix tbody tr:last-child > * { border-bottom: 0; }
.matrix thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.matrix th[scope="row"], .matrix thead th:first-child { text-align: left; }
.matrix th[scope="row"] { font-family: var(--font-num); font-size: 13px; }
.matrix td { font-family: var(--font-num); font-size: 13px; }
.matrix td.same { color: var(--muted); }
.matrix tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.dot--rub { background: var(--rub); } .dot--usd { background: var(--usd); } .dot--idr { background: var(--idr); }
.dot--btc { background: var(--btc); } .dot--eth { background: var(--eth); }
.delta { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 600; margin-top: 2px; padding-left: 16px; }
.delta--up { color: var(--up); } .delta--down { color: var(--down); }

.foot { display: grid; gap: 6px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.foot p { margin: 0; }
.ticket__foot .foot-official { grid-column: 1 / -1; }
.foot-official { color: var(--muted); }
.srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.srcs li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.srcs b { font-family: var(--font-num); font-size: 11px; min-width: 34px; color: var(--ink); }
.srcs__warn { color: var(--btc); }

@media (max-width: 480px) {
  .ticket { padding: 22px 16px 16px; border-radius: 22px; }
  .amount, .result { padding: 10px 14px; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useEffect, useMemo, useRef, useState, useCallback } = React;
// Data source for the single-file build (GitHub Pages and the artifact demo).
// No backend here, so the browser asks the public APIs directly.
//
// Rule of this file: a timestamp is never invented. Every rate carries the
// provider's own "as of" time, or null when the provider states none, and the
// UI reports that honestly instead of showing the moment we made the request.

const CODES = ["RUB", "IDR", "BTC", "ETH"];
const DEMO_RATES = { USD: 1, RUB: 82.4, IDR: 16480, BTC: 1 / 112500, ETH: 1 / 4150 };

const getJSON = async (url, ms = 7000) => {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(url, { signal: ac.signal });
    if (!r.ok) throw new Error(`${new URL(url).host} ${r.status}`);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
};

// Coinbase Exchange: last traded price plus the exchange's own timestamp.
async function cryptoFromCoinbase() {
  const one = async (code) => {
    const t = await getJSON(`https://api.exchange.coinbase.com/products/${code}-USD/ticker`);
    const price = Number(t.price);
    if (!price) throw new Error(`${code}: no price`);
    return [code, { perUsd: 1 / price, asOf: t.time || null, src: "Coinbase Exchange" }];
  };
  return Object.fromEntries(await Promise.all(["BTC", "ETH"].map(one)));
}

async function changeFromCoinbase() {
  const one = async (code) => {
    const s = await getJSON(`https://api.exchange.coinbase.com/products/${code}-USD/stats`);
    return [code, ((s.last - s.open) / s.open) * 100];
  };
  return Object.fromEntries(await Promise.all(["BTC", "ETH"].map(one)));
}

// Coinbase's reference table covers fiat, but carries no timestamp of its own and
// has been seen ~1% off the market, so it is only a fallback for RUB/IDR.
async function fiatFromCoinbase() {
  const d = await getJSON("https://api.coinbase.com/v2/exchange-rates?currency=USD");
  const out = {};
  for (const c of ["RUB", "IDR"]) {
    const v = Number(d.data.rates[c]);
    if (v) out[c] = { perUsd: v, asOf: null, src: "Coinbase" };
  }
  return out;
}

// ExchangeRate-API: a once-a-day fixing that does state when it was made.
async function fromErApi() {
  const d = await getJSON("https://open.er-api.com/v6/latest/USD");
  if (d.result !== "success") throw new Error(`er-api: ${d["error-type"]}`);
  const asOf = d.time_last_update_unix ? new Date(d.time_last_update_unix * 1000).toISOString() : null;
  const out = {};
  for (const c of ["RUB", "IDR"]) {
    if (d.rates[c]) out[c] = { perUsd: d.rates[c], asOf, src: "open.er-api.com" };
  }
  return out;
}

async function fromCoinGecko() {
  const d = await getJSON(
    "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true&include_last_updated_at=true"
  );
  const rates = {};
  const change = {};
  for (const [code, id] of [["BTC", "bitcoin"], ["ETH", "ethereum"]]) {
    rates[code] = {
      perUsd: 1 / d[id].usd,
      asOf: d[id].last_updated_at ? new Date(d[id].last_updated_at * 1000).toISOString() : null,
      src: "CoinGecko",
    };
    if (d[id].usd_24h_change != null) change[code] = d[id].usd_24h_change;
  }
  return { rates, change };
}

// Bank of Russia official rate: the legal reference rate, published once a day.
async function officialRub() {
  const d = await getJSON("https://www.cbr-xml-daily.ru/daily_json.js");
  const v = d.Valute?.USD;
  if (!v?.Value) throw new Error("cbr: no USD");
  return { rate: v.Value, asOf: d.Date || null, src: "ЦБ РФ" };
}

async function loadRates() {
  const rates = { USD: 1 };
  const meta = {};
  const official = {};
  let change = {};

  const take = (got) => {
    for (const [code, v] of Object.entries(got)) {
      if (!(code in rates)) {
        rates[code] = v.perUsd;
        meta[code] = { src: v.src, asOf: v.asOf };
      }
    }
  };
  const missing = () => CODES.filter((c) => !(c in rates));

  const [crypto, fiat, cbr, stats] = await Promise.allSettled([
    cryptoFromCoinbase(),
    fromErApi(),
    officialRub(),
    changeFromCoinbase(),
  ]);
  if (crypto.status === "fulfilled") take(crypto.value);
  if (fiat.status === "fulfilled") take(fiat.value);
  if (stats.status === "fulfilled") change = stats.value;
  if (cbr.status === "fulfilled") official.RUB = cbr.value;

  if (missing().some((c) => c === "RUB" || c === "IDR")) {
    try {
      take(await fiatFromCoinbase());
    } catch { /* next fallback */ }
  }
  if (missing().some((c) => c === "BTC" || c === "ETH") || !Object.keys(change).length) {
    try {
      const cg = await fromCoinGecko();
      take(cg.rates);
      if (!Object.keys(change).length) change = cg.change;
    } catch { /* next fallback */ }
  }
  // Nothing else answered for the rouble: the official rate can stand in, labelled as such.
  if (!("RUB" in rates) && official.RUB) {
    rates.RUB = official.RUB.rate;
    meta.RUB = { src: "ЦБ РФ (официальный)", asOf: official.RUB.asOf };
  }

  if (missing().length) {
    return {
      mode: "demo",
      rates: DEMO_RATES,
      meta: {},
      official,
      change_24h: { BTC: 1.84, ETH: -0.62 },
      fetched_at: new Date().toISOString(),
    };
  }
  return { mode: "live", rates, meta, official, change_24h: change, fetched_at: new Date().toISOString() };
}


const CURRENCIES = [
  { code: "RUB", name: "Российский рубль", sign: "₽", decimals: 2, kind: "fiat" },
  { code: "USD", name: "Доллар США", sign: "$", decimals: 2, kind: "fiat" },
  { code: "IDR", name: "Индонезийская рупия", sign: "Rp", decimals: 0, kind: "fiat" },
  { code: "BTC", name: "Bitcoin", sign: "₿", decimals: 8, kind: "crypto" },
  { code: "ETH", name: "Ethereum", sign: "Ξ", decimals: 6, kind: "crypto" },
];
const BY_CODE = Object.fromEntries(CURRENCIES.map((c) => [c.code, c]));
const REFRESH_MS = 60_000;

// Icons as inline SVG: font glyphs like ◐ or ☀ fall back to random fonts or emoji.
const ICON = { width: 16, height: 16, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", "aria-hidden": true };
const THEMES = [
  {
    id: "system", label: "Как в системе",
    icon: <svg {...ICON}><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" /></svg>,
  },
  {
    id: "light", label: "Светлая тема",
    icon: (
      <svg {...ICON}>
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    ),
  },
  {
    id: "dark", label: "Тёмная тема",
    icon: <svg {...ICON}><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>,
  },
];
const THEME_KEY = "kurs-theme";

function readTheme() {
  try {
    return localStorage.getItem(THEME_KEY) || "system";
  } catch {
    return "system";
  }
}

function ThemeSwitch({ value, onChange }) {
  return (
    <div className="theme-switch" role="radiogroup" aria-label="Тема оформления">
      {THEMES.map((t) => (
        <button
          key={t.id}
          type="button"
          role="radio"
          aria-checked={value === t.id}
          aria-label={t.label}
          title={t.label}
          onClick={() => onChange(t.id)}
        >
          {t.icon}
        </button>
      ))}
    </div>
  );
}

function parseAmount(text) {
  const n = Number(String(text).replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) && n >= 0 ? n : null;
}

// Fixed decimals per currency, but never round a small non-zero value down to "0".
function fmt(value, code) {
  if (value == null || !Number.isFinite(value)) return "—";
  const d = BY_CODE[code]?.decimals ?? 2;
  if (value !== 0 && Math.abs(value) < Math.pow(10, -d)) {
    return value.toLocaleString("ru-RU", { maximumSignificantDigits: 4 });
  }
  const digits = value !== 0 && Math.abs(value) < 1 && d === 0 ? 4 : d;
  return value.toLocaleString("ru-RU", { minimumFractionDigits: Math.min(digits, 2), maximumFractionDigits: digits });
}

// Rates in the matrix: keep ~6 significant digits so 0.0000105 and 9 500 000 both read well.
function fmtRate(value) {
  if (!Number.isFinite(value)) return "—";
  if (Math.abs(value) >= 1000) return value.toLocaleString("ru-RU", { maximumFractionDigits: 0 });
  if (Math.abs(value) >= 1) return value.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  return value.toLocaleString("ru-RU", { maximumSignificantDigits: 4 });
}

// Copied text drops the thousands separators so it pastes into calculators and
// spreadsheets as a number: "9 156 420,5" -> "9156420,5".
const forClipboard = (text) => String(text).replace(/[\s\u00a0\u202f]/g, "");

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Older browsers and some embedded views refuse the async clipboard API.
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
    return ok;
  }
}

function Copy({ id, text, copied, onCopy, className = "", children }) {
  const value = forClipboard(text);
  return (
    <button
      type="button"
      className={`copy ${className}`}
      onClick={() => onCopy(id, value)}
      title="Нажмите, чтобы скопировать"
      aria-label={`Скопировать ${value}`}
      data-copied={copied?.id === id && copied.ok ? "" : undefined}
    >
      {children ?? text}
    </button>
  );
}

// Freshness is judged by each provider's own timestamp, never by when we fetched.
const FRESH_MS = 15 * 60_000;
const DAY_MS = 36 * 3600_000;

function freshness(data, now) {
  if (!data) return { kind: "err", text: "нет данных" };
  if (data.mode === "demo") return { kind: "demo", text: "демо-курсы" };
  const used = Object.values(data.meta || {});
  if (!used.length) return { kind: "unknown", text: "возраст неизвестен" };
  if (used.some((m) => !m.asOf)) return { kind: "unknown", text: "возраст неизвестен" };
  const oldest = Math.max(...used.map((m) => now - new Date(m.asOf)));
  if (oldest < FRESH_MS) return { kind: "live", text: "онлайн" };
  if (oldest < DAY_MS) return { kind: "day", text: "курс дня" };
  return { kind: "stale", text: "устарело" };
}

function timeAgo(date, now) {
  const s = Math.max(0, Math.round((now - date) / 1000));
  if (s < 60) return `${s} с назад`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m} мин назад`;
  return date.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

// Banknote-style guilloche rosette, drawn once per theme change.
function Guilloche({ theme }) {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const draw = () => {
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = canvas.getBoundingClientRect();
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);
      const color = getComputedStyle(canvas).color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 0.6;
      const cx = width - 120, cy = height / 2;
      for (let ring = 0; ring < 6; ring++) {
        const R = 70 + ring * 22, r = 9 + ring * 2, d = 26 + ring * 4;
        ctx.globalAlpha = 0.5 - ring * 0.06;
        ctx.beginPath();
        for (let t = 0; t <= Math.PI * 2 * r; t += 0.02) {
          const x = (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
          const y = (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);
          t === 0 ? ctx.moveTo(cx + x, cy + y) : ctx.lineTo(cx + x, cy + y);
        }
        ctx.stroke();
      }
    };
    // next frame: the parent applies data-theme in its own effect, after this one runs
    const raf = requestAnimationFrame(draw);
    const ro = new ResizeObserver(draw);
    ro.observe(canvas);
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener?.("change", draw);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); mq.removeEventListener?.("change", draw); };
  }, [theme]);
  return <canvas ref={ref} className="guilloche" aria-hidden="true" />;
}

function CurrencyPicker({ id, value, onChange }) {
  return (
    <div className="picker" role="radiogroup" aria-labelledby={id}>
      {CURRENCIES.map((c) => (
        <button
          key={c.code}
          type="button"
          role="radio"
          aria-checked={value === c.code}
          className={`chip chip--${c.code.toLowerCase()}`}
          onClick={() => onChange(c.code)}
          title={c.name}
        >
          <span className="chip__sign">{c.sign}</span>
          {c.code}
        </button>
      ))}
    </div>
  );
}

function Change({ value }) {
  if (value == null) return null;
  const up = value >= 0;
  return (
    <span className={`delta ${up ? "delta--up" : "delta--down"}`}>
      {up ? "▲" : "▼"} {Math.abs(value).toLocaleString("ru-RU", { maximumFractionDigits: 2 })}% за 24 ч
    </span>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [amountText, setAmountText] = useState("0,05");
  const [from, setFrom] = useState("BTC");
  const [to, setTo] = useState("RUB");
  const [copied, setCopied] = useState(null);
  const [theme, setTheme] = useState(readTheme);
  // A host page (e.g. the claude.ai viewer) may already pin a theme; "system" goes back to it.
  const hostTheme = useRef(document.documentElement.getAttribute("data-theme"));

  useEffect(() => {
    const root = document.documentElement;
    const target = theme === "system" ? hostTheme.current : theme;
    if (target) root.setAttribute("data-theme", target);
    else root.removeAttribute("data-theme");
    try {
      if (theme === "system") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, theme);
    } catch { /* storage blocked: the choice lasts for this visit only */ }
  }, [theme]);
  const copyTimer = useRef(null);

  const onCopy = useCallback(async (id, text) => {
    const ok = await copyText(text);
    setCopied({ id, text, ok });
    clearTimeout(copyTimer.current);
    copyTimer.current = setTimeout(() => setCopied(null), 1800);
  }, []);

  const refresh = useCallback(async (force = false) => {
    setLoading(true);
    try {
      setData(await loadRates(force));
      setError(null);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refresh();
    const t = setInterval(() => refresh(), REFRESH_MS);
    const clock = setInterval(() => setNow(Date.now()), 5_000);
    return () => { clearInterval(t); clearInterval(clock); };
  }, [refresh]);

  const rates = data?.rates;
  const amount = parseAmount(amountText);
  const conv = useCallback((v, a, b) => (rates ? (v * rates[b]) / rates[a] : null), [rates]);
  const result = amount != null ? conv(amount, from, to) : null;
  const fresh = error && !data ? { kind: "err", text: "нет данных" } : freshness(data, now);
  const fetched = data ? new Date(data.fetched_at) : null;
  const cbr = data?.official?.RUB;

  const pickFrom = (c) => { if (c === to) setTo(from); setFrom(c); };
  const pickTo = (c) => { if (c === from) setFrom(to); setTo(c); };
  const swap = () => {
    setFrom(to);
    setTo(from);
    if (result != null) setAmountText(fmt(result, to).replace(/\s/g, ""));
  };

  const others = useMemo(() => CURRENCIES.filter((c) => c.code !== from), [from]);

  return (
    <div className="page">
      <header className="masthead">
        <div className="brand">
          <span className="brand__mark" aria-hidden="true">₽⇄₿</span>
          <div>
            <h1>Kurs</h1>
            <p className="brand__sub">Рубль, доллар, рупия, биткоин и эфир по текущему курсу</p>
          </div>
        </div>
        <div className="status">
          <ThemeSwitch value={theme} onChange={setTheme} />
          <span className={`pill pill--${fresh.kind}`} title="Свежесть по метке времени самого источника">
            <span className="pill__dot" />
            {fresh.text}
          </span>
          <button type="button" className="btn-ghost" onClick={() => refresh(true)} disabled={loading} id="refresh">
            {loading ? "Обновляю…" : "Обновить"}
          </button>
        </div>
      </header>

      <section className="ticket" aria-label="Конвертер">
        <Guilloche theme={theme} />
        <div className="ticket__row">
          <label className="label" id="from-label" htmlFor="amount">Отдаю</label>
          <CurrencyPicker id="from-label" value={from} onChange={pickFrom} />
          <div className="amount">
            <input
              id="amount"
              inputMode="decimal"
              autoComplete="off"
              value={amountText}
              onChange={(e) => setAmountText(e.target.value)}
              aria-invalid={amount == null}
            />
            <span className="amount__code">{from}</span>
          </div>
          {amount == null && <p className="hint hint--err">Введите число, например 1500 или 0,25</p>}
        </div>

        <button type="button" className="swap" onClick={swap} aria-label="Поменять валюты местами"><span aria-hidden="true">⇅</span></button>

        <div className="ticket__row">
          <span className="label" id="to-label">Получаю</span>
          <CurrencyPicker id="to-label" value={to} onChange={pickTo} />
          <output className="result" htmlFor="amount" aria-live="polite">
            <Copy id="result" text={fmt(result, to)} copied={copied} onCopy={onCopy} className="result__value" />
            {/* sats sit under the code inside the field, so the card height never changes */}
            <span className="result__side">
              <span className="amount__code">{to}</span>
              {to === "BTC" && result != null && result < 0.01 && (
                <span className="result__sats">≈ {Math.round(result * 1e8).toLocaleString("ru-RU")} sat</span>
              )}
            </span>
          </output>
        </div>

        <div className="ticket__foot">
          <span>1 {from} = <Copy id="rate-fwd" text={fmtRate(conv(1, from, to))} copied={copied} onCopy={onCopy} className="rate" /> {to}</span>
          <span>1 {to} = <Copy id="rate-back" text={fmtRate(conv(1, to, from))} copied={copied} onCopy={onCopy} className="rate" /> {from}</span>
          {cbr && (
            <span className="foot-official">
              Офиц. курс ЦБ РФ{cbr.asOf ? ` на ${new Date(cbr.asOf).toLocaleDateString("ru-RU", { day: "numeric", month: "long" })}` : ""}:
              {" "}1 USD = <Copy id="cbr" text={fmtRate(cbr.rate)} copied={copied} onCopy={onCopy} className="rate" /> ₽
            </span>
          )}
        </div>
      </section>

      <section aria-labelledby="all-h">
        <h2 id="all-h" className="section-h">
          {amount != null ? fmt(amount, from) : "—"} {from} во всех валютах
        </h2>
        <p className="hint copy-hint">Нажмите на любое число, чтобы скопировать его</p>
        <div className="tiles">
          {others.map((c) => {
            const value = amount != null ? fmt(conv(amount, from, c.code), c.code) : "—";
            return (
              <Copy key={c.code} id={`tile-${c.code}`} text={value} copied={copied} onCopy={onCopy} className={`tile tile--${c.code.toLowerCase()}`}>
                <span className="tile__code">{c.sign} {c.code}</span>
                <span className="tile__value">{value}</span>
                <span className="tile__name">{c.name}</span>
              </Copy>
            );
          })}
        </div>
      </section>

      <section aria-labelledby="mx-h">
        <h2 id="mx-h" className="section-h">Кросс-курсы</h2>
        <div className="matrix-wrap">
          <table className="matrix">
            <thead>
              <tr>
                <th scope="col">1 единица</th>
                {CURRENCIES.map((c) => <th scope="col" key={c.code}>в {c.code}</th>)}
              </tr>
            </thead>
            <tbody>
              {CURRENCIES.map((r) => (
                <tr key={r.code}>
                  <th scope="row">
                    <span className={`dot dot--${r.code.toLowerCase()}`} />1 {r.code}
                    {r.kind === "crypto" && <Change value={data?.change_24h?.[r.code]} />}
                  </th>
                  {CURRENCIES.map((c) => (
                    <td key={c.code} className={r.code === c.code ? "same" : ""}>
                      {r.code === c.code ? "1" : (
                        <Copy id={`mx-${r.code}-${c.code}`} text={fmtRate(conv(1, r.code, c.code))} copied={copied} onCopy={onCopy} />
                      )}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      <footer className="foot">
        {error && <p className="hint hint--err">Не удалось обновить курсы: {error}. Показаны последние полученные данные.</p>}
        {data?.mode === "demo" && (
          <p className="hint">
            Живые API недоступны в этом окне, поэтому показаны примерные курсы. В полной версии курсы приходят с бэкенда на Python.
          </p>
        )}
        {data?.mode === "live" && (
          <ul className="srcs">
            {CURRENCIES.filter((c) => c.code !== "USD").map((c) => {
              const m = data.meta?.[c.code];
              return (
                <li key={c.code}>
                  <b>{c.code}</b>
                  <span>{m ? m.src : "—"}</span>
                  <span className={m && !m.asOf ? "srcs__warn" : undefined}>
                    {m ? (m.asOf ? timeAgo(new Date(m.asOf), now) : "без метки времени") : "—"}
                  </span>
                </li>
              );
            })}
            {cbr && (
              <li>
                <b>RUB</b>
                <span>ЦБ РФ (официальный)</span>
                <span>{cbr.asOf ? new Date(cbr.asOf).toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "—"}</span>
              </li>
            )}
          </ul>
        )}
        <p>
          Запрошено {fetched ? timeAgo(fetched, now) : "—"} · автообновление раз в минуту.
          Это справочные курсы: для крупной суммы цену назначает банк или биржа, а не справочник.
        </p>
      </footer>

      <div className="toast" role="status" aria-live="polite" hidden={!copied}>
        {copied && (copied.ok ? <>Скопировано: <b>{copied.text}</b></> : "Не получилось скопировать. Выделите число и нажмите Ctrl+C")}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
