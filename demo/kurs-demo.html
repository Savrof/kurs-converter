<title>Kurs конвертер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: single column "banknote ticket" up top, then tiles and a cross-rate matrix. */
:root {
  --paper: #eaf0ec;
  --surface: #f7faf8;
  --ink: #12302a;
  --muted: #557069;
  --line: #c9d8d1;
  --accent: #0f6a5a;
  --accent-ink: #f2fbf7;
  --guilloche: #0f6a5a;
  --up: #1d7a46;
  --down: #b4322a;
  --rub: #2d5ca8;
  --usd: #5f7a1f;
  --idr: #c23b2e;
  --btc: #d9811a;
  --eth: #5a63c4;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c1715; --surface: #12211e; --ink: #e2ede8; --muted: #8fa9a1; --line: #23392f;
    --accent: #3fbfa3; --accent-ink: #062019; --guilloche: #3fbfa3; --up: #4cc47f; --down: #f07a6e;
    --rub: #7aa3f0; --usd: #b6cf6a; --idr: #f07e6f; --btc: #f3a849; --eth: #9aa2f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c1715; --surface: #12211e; --ink: #e2ede8; --muted: #8fa9a1; --line: #23392f;
  --accent: #3fbfa3; --accent-ink: #062019; --guilloche: #3fbfa3; --up: #4cc47f; --down: #f07a6e;
  --rub: #7aa3f0; --usd: #b6cf6a; --idr: #f07e6f; --btc: #f3a849; --eth: #9aa2f5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.page {
  max-width: 920px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 28px 40px;
  display: grid;
  gap: 32px;
}
/* let wide children (the matrix) scroll inside their own box instead of widening the page */
.page > * { min-width: 0; }

/* Masthead */
.masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand__mark {
  font-family: var(--font-num); font-weight: 600; font-size: 15px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink);
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.brand__sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.status { display: flex; align-items: center; gap: 10px; }

.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  border: 1px solid var(--line); background: var(--surface);
}
.pill__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill--live { color: var(--up); }
.pill--live .pill__dot { animation: pulse 2s ease-in-out infinite; }
.pill--demo, .pill--stale { color: var(--btc); }
.pill--err { color: var(--down); }
@keyframes pulse { 50% { opacity: 0.3; } }

.btn-ghost {
  padding: 7px 14px; border-radius: 8px; font-size: 14px; font-weight: 600;
  background: transparent; border: 1px solid var(--line);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn-ghost:disabled { opacity: 0.6; cursor: progress; }

/* Ticket: the one decorated object on the page */
.ticket {
  position: relative; overflow: hidden;
  display: grid; gap: 18px;
  padding: 26px 26px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 1px 0 var(--line), 0 18px 40px -28px rgba(10, 40, 34, 0.45);
}
.ticket::before {
  /* perforation like a tear-off exchange slip */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px;
  background: radial-gradient(circle at 6px -2px, var(--paper) 4px, transparent 4.5px) 0 0 / 14px 6px repeat-x;
}
.guilloche {
  position: absolute; inset: 0; width: 100%; height: 100%;
  color: var(--guilloche); opacity: 0.22; pointer-events: none;
}
.ticket__row { position: relative; display: grid; gap: 10px; }
.label {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);
}

.picker { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  --c: var(--accent);
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 999px;
  font-family: var(--font-num); font-size: 13px; font-weight: 600;
  background: var(--paper); border: 1px solid var(--line);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.chip__sign { color: var(--c); }
.chip:hover { border-color: var(--c); }
.chip[aria-checked="true"] { background: var(--c); border-color: var(--c); color: var(--surface); }
.chip[aria-checked="true"] .chip__sign { color: inherit; }
.chip--rub { --c: var(--rub); } .chip--usd { --c: var(--usd); } .chip--idr { --c: var(--idr); }
.chip--btc { --c: var(--btc); } .chip--eth { --c: var(--eth); }

.amount, .result {
  display: flex; align-items: baseline; gap: 12px; min-width: 0;
  border-bottom: 2px solid var(--line); padding-bottom: 6px;
}
.amount:focus-within { border-color: var(--accent); }
.amount input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font-family: var(--font-num); font-size: clamp(26px, 6vw, 40px); font-weight: 600;
  font-variant-numeric: tabular-nums; padding: 0;
}
.amount input:focus { outline: none; }
.result__value {
  flex: 1; min-width: 0; overflow-wrap: anywhere;
  font-family: var(--font-num); font-size: clamp(26px, 6vw, 40px); font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--accent);
}
.amount__code { font-family: var(--font-display); font-size: 15px; font-weight: 500; color: var(--muted); }

.swap {
  position: relative; justify-self: start;
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--paper); font-size: 20px;
  transition: transform 0.25s;
}
.swap:hover { transform: rotate(180deg); border-color: var(--accent); color: var(--accent); }

.ticket__foot {
  position: relative; display: flex; flex-wrap: wrap; gap: 6px 22px;
  padding-top: 12px; border-top: 1px dashed var(--line);
  font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
}
.ticket__foot b { font-family: var(--font-num); color: var(--ink); font-weight: 600; }

.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint--err { color: var(--down); }

/* Sections */
.section-h {
  font-family: var(--font-display); font-weight: 500; font-size: 16px;
  margin: 0 0 14px; text-wrap: balance;
}
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile {
  --c: var(--accent);
  display: grid; gap: 4px; text-align: left; min-width: 0;
  padding: 14px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line);
  border-top: 3px solid var(--c);
}
.tile:hover { border-color: var(--c); }
.tile__code { font-family: var(--font-num); font-size: 12px; font-weight: 600; color: var(--c); letter-spacing: 0.04em; }
.tile__value { font-family: var(--font-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile__name { font-size: 12px; color: var(--muted); }
.tile--rub { --c: var(--rub); } .tile--usd { --c: var(--usd); } .tile--idr { --c: var(--idr); }
.tile--btc { --c: var(--btc); } .tile--eth { --c: var(--eth); }

.matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.matrix { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 660px; }
.matrix th, .matrix td { padding: 11px 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.matrix tbody tr:last-child > * { border-bottom: 0; }
.matrix thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.matrix th[scope="row"], .matrix thead th:first-child { text-align: left; }
.matrix th[scope="row"] { font-family: var(--font-num); font-size: 13px; }
.matrix td { font-family: var(--font-num); font-size: 13px; }
.matrix td.same { color: var(--muted); }
.matrix tbody tr:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.dot--rub { background: var(--rub); } .dot--usd { background: var(--usd); } .dot--idr { background: var(--idr); }
.dot--btc { background: var(--btc); } .dot--eth { background: var(--eth); }
.delta { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 600; margin-top: 2px; padding-left: 16px; }
.delta--up { color: var(--up); } .delta--down { color: var(--down); }

.foot { display: grid; gap: 6px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.foot p { margin: 0; }

@media (max-width: 480px) {
  .ticket { padding: 22px 16px 16px; }
  h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useEffect, useMemo, useRef, useState, useCallback } = React;
// Demo data source for the single-file preview: no backend here, so try the
// public APIs straight from the browser and fall back to sample rates.
const DEMO_RATES = { USD: 1, RUB: 82.4, IDR: 16480, BTC: 1 / 112500, ETH: 1 / 4150 };

async function loadRates() {
  try {
    const [fx, cg] = await Promise.all([
      fetch("https://open.er-api.com/v6/latest/USD").then((r) => r.json()),
      fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true").then((r) => r.json()),
    ]);
    return {
      mode: "live",
      rates: { USD: 1, RUB: fx.rates.RUB, IDR: fx.rates.IDR, BTC: 1 / cg.bitcoin.usd, ETH: 1 / cg.ethereum.usd },
      change_24h: { BTC: cg.bitcoin.usd_24h_change, ETH: cg.ethereum.usd_24h_change },
      updated_at: new Date().toISOString(),
      sources: ["open.er-api.com", "coingecko.com"],
    };
  } catch {
    return {
      mode: "demo",
      rates: DEMO_RATES,
      change_24h: { BTC: 1.84, ETH: -0.62 },
      updated_at: new Date().toISOString(),
      sources: ["примерные значения"],
    };
  }
}


const CURRENCIES = [
  { code: "RUB", name: "Российский рубль", sign: "₽", decimals: 2, kind: "fiat" },
  { code: "USD", name: "Доллар США", sign: "$", decimals: 2, kind: "fiat" },
  { code: "IDR", name: "Индонезийская рупия", sign: "Rp", decimals: 0, kind: "fiat" },
  { code: "BTC", name: "Bitcoin", sign: "₿", decimals: 8, kind: "crypto" },
  { code: "ETH", name: "Ethereum", sign: "Ξ", decimals: 6, kind: "crypto" },
];
const BY_CODE = Object.fromEntries(CURRENCIES.map((c) => [c.code, c]));
const REFRESH_MS = 60_000;

function parseAmount(text) {
  const n = Number(String(text).replace(/\s/g, "").replace(",", "."));
  return Number.isFinite(n) && n >= 0 ? n : null;
}

// Fixed decimals per currency, but never round a small non-zero value down to "0".
function fmt(value, code) {
  if (value == null || !Number.isFinite(value)) return "—";
  const d = BY_CODE[code]?.decimals ?? 2;
  if (value !== 0 && Math.abs(value) < Math.pow(10, -d)) {
    return value.toLocaleString("ru-RU", { maximumSignificantDigits: 4 });
  }
  const digits = value !== 0 && Math.abs(value) < 1 && d === 0 ? 4 : d;
  return value.toLocaleString("ru-RU", { minimumFractionDigits: Math.min(digits, 2), maximumFractionDigits: digits });
}

// Rates in the matrix: keep ~6 significant digits so 0.0000105 and 9 500 000 both read well.
function fmtRate(value) {
  if (!Number.isFinite(value)) return "—";
  if (Math.abs(value) >= 1000) return value.toLocaleString("ru-RU", { maximumFractionDigits: 0 });
  if (Math.abs(value) >= 1) return value.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  return value.toLocaleString("ru-RU", { maximumSignificantDigits: 4 });
}

function timeAgo(date, now) {
  const s = Math.max(0, Math.round((now - date) / 1000));
  if (s < 60) return `${s} с назад`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m} мин назад`;
  return date.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}

// Banknote-style guilloche rosette, drawn once per theme change.
function Guilloche() {
  const ref = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    const draw = () => {
      const dpr = window.devicePixelRatio || 1;
      const { width, height } = canvas.getBoundingClientRect();
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, width, height);
      const color = getComputedStyle(canvas).color;
      ctx.strokeStyle = color;
      ctx.lineWidth = 0.6;
      const cx = width - 120, cy = height / 2;
      for (let ring = 0; ring < 6; ring++) {
        const R = 70 + ring * 22, r = 9 + ring * 2, d = 26 + ring * 4;
        ctx.globalAlpha = 0.5 - ring * 0.06;
        ctx.beginPath();
        for (let t = 0; t <= Math.PI * 2 * r; t += 0.02) {
          const x = (R - r) * Math.cos(t) + d * Math.cos(((R - r) / r) * t);
          const y = (R - r) * Math.sin(t) - d * Math.sin(((R - r) / r) * t);
          t === 0 ? ctx.moveTo(cx + x, cy + y) : ctx.lineTo(cx + x, cy + y);
        }
        ctx.stroke();
      }
    };
    draw();
    const ro = new ResizeObserver(draw);
    ro.observe(canvas);
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener?.("change", draw);
    return () => { ro.disconnect(); mq.removeEventListener?.("change", draw); };
  }, []);
  return <canvas ref={ref} className="guilloche" aria-hidden="true" />;
}

function CurrencyPicker({ id, value, onChange, exclude }) {
  return (
    <div className="picker" role="radiogroup" aria-labelledby={id}>
      {CURRENCIES.map((c) => (
        <button
          key={c.code}
          type="button"
          role="radio"
          aria-checked={value === c.code}
          className={`chip chip--${c.code.toLowerCase()}`}
          onClick={() => onChange(c.code)}
          title={c.name}
          data-dim={exclude === c.code ? "" : undefined}
        >
          <span className="chip__sign">{c.sign}</span>
          {c.code}
        </button>
      ))}
    </div>
  );
}

function Change({ value }) {
  if (value == null) return null;
  const up = value >= 0;
  return (
    <span className={`delta ${up ? "delta--up" : "delta--down"}`}>
      {up ? "▲" : "▼"} {Math.abs(value).toLocaleString("ru-RU", { maximumFractionDigits: 2 })}% за 24 ч
    </span>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const [now, setNow] = useState(Date.now());
  const [amountText, setAmountText] = useState("0,05");
  const [from, setFrom] = useState("BTC");
  const [to, setTo] = useState("RUB");

  const refresh = useCallback(async (force = false) => {
    setLoading(true);
    try {
      setData(await loadRates(force));
      setError(null);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    refresh();
    const t = setInterval(() => refresh(), REFRESH_MS);
    const clock = setInterval(() => setNow(Date.now()), 5_000);
    return () => { clearInterval(t); clearInterval(clock); };
  }, [refresh]);

  const rates = data?.rates;
  const amount = parseAmount(amountText);
  const conv = useCallback((v, a, b) => (rates ? (v * rates[b]) / rates[a] : null), [rates]);
  const result = amount != null ? conv(amount, from, to) : null;
  const updated = data ? new Date(data.updated_at) : null;
  const stale = updated && now - updated > 10 * 60_000;

  const pickFrom = (c) => { if (c === to) setTo(from); setFrom(c); };
  const pickTo = (c) => { if (c === from) setFrom(to); setTo(c); };
  const swap = () => {
    setFrom(to);
    setTo(from);
    if (result != null) setAmountText(fmt(result, to).replace(/\s/g, ""));
  };

  const others = useMemo(() => CURRENCIES.filter((c) => c.code !== from), [from]);

  return (
    <div className="page">
      <header className="masthead">
        <div className="brand">
          <span className="brand__mark" aria-hidden="true">₽⇄₿</span>
          <div>
            <h1>Kurs</h1>
            <p className="brand__sub">Рубль, доллар, рупия, биткоин и эфир по текущему курсу</p>
          </div>
        </div>
        <div className="status">
          <span className={`pill pill--${error && !data ? "err" : data?.mode === "demo" ? "demo" : stale ? "stale" : "live"}`}>
            <span className="pill__dot" />
            {error && !data ? "нет данных" : data?.mode === "demo" ? "демо-курсы" : stale ? "устарело" : "онлайн"}
          </span>
          <button type="button" className="btn-ghost" onClick={() => refresh(true)} disabled={loading} id="refresh">
            {loading ? "Обновляю…" : "Обновить"}
          </button>
        </div>
      </header>

      <section className="ticket" aria-label="Конвертер">
        <Guilloche />
        <div className="ticket__row">
          <label className="label" id="from-label" htmlFor="amount">Отдаю</label>
          <CurrencyPicker id="from-label" value={from} onChange={pickFrom} />
          <div className="amount">
            <input
              id="amount"
              inputMode="decimal"
              autoComplete="off"
              value={amountText}
              onChange={(e) => setAmountText(e.target.value)}
              aria-invalid={amount == null}
            />
            <span className="amount__code">{from}</span>
          </div>
          {amount == null && <p className="hint hint--err">Введите число, например 1500 или 0,25</p>}
        </div>

        <button type="button" className="swap" onClick={swap} aria-label="Поменять валюты местами">⇅</button>

        <div className="ticket__row">
          <span className="label" id="to-label">Получаю</span>
          <CurrencyPicker id="to-label" value={to} onChange={pickTo} />
          <output className="result" htmlFor="amount" aria-live="polite">
            <span className="result__value">{fmt(result, to)}</span>
            <span className="amount__code">{to}</span>
          </output>
          {to === "BTC" && result != null && result < 0.01 && (
            <p className="hint">≈ {Math.round(result * 1e8).toLocaleString("ru-RU")} sat</p>
          )}
        </div>

        <div className="ticket__foot">
          <span>1 {from} = <b>{fmtRate(conv(1, from, to))}</b> {to}</span>
          <span>1 {to} = <b>{fmtRate(conv(1, to, from))}</b> {from}</span>
        </div>
      </section>

      <section aria-labelledby="all-h">
        <h2 id="all-h" className="section-h">
          {amount != null ? fmt(amount, from) : "—"} {from} во всех валютах
        </h2>
        <div className="tiles">
          {others.map((c) => (
            <button type="button" key={c.code} className={`tile tile--${c.code.toLowerCase()}`} onClick={() => pickTo(c.code)}>
              <span className="tile__code">{c.sign} {c.code}</span>
              <span className="tile__value">{amount != null ? fmt(conv(amount, from, c.code), c.code) : "—"}</span>
              <span className="tile__name">{c.name}</span>
            </button>
          ))}
        </div>
      </section>

      <section aria-labelledby="mx-h">
        <h2 id="mx-h" className="section-h">Кросс-курсы</h2>
        <div className="matrix-wrap">
          <table className="matrix">
            <thead>
              <tr>
                <th scope="col">1 единица</th>
                {CURRENCIES.map((c) => <th scope="col" key={c.code}>в {c.code}</th>)}
              </tr>
            </thead>
            <tbody>
              {CURRENCIES.map((r) => (
                <tr key={r.code}>
                  <th scope="row">
                    <span className={`dot dot--${r.code.toLowerCase()}`} />1 {r.code}
                    {r.kind === "crypto" && <Change value={data?.change_24h?.[r.code]} />}
                  </th>
                  {CURRENCIES.map((c) => (
                    <td key={c.code} className={r.code === c.code ? "same" : ""}>
                      {r.code === c.code ? "1" : fmtRate(conv(1, r.code, c.code))}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>

      <footer className="foot">
        {error && <p className="hint hint--err">Не удалось обновить курсы: {error}. Показаны последние полученные данные.</p>}
        {data?.mode === "demo" && (
          <p className="hint">
            Живые API недоступны в этом окне, поэтому показаны примерные курсы. В полной версии курсы приходят с бэкенда на Python.
          </p>
        )}
        <p>
          Обновлено {updated ? timeAgo(updated, now) : "—"} · источники: {data?.sources?.join(", ") || "—"} · автообновление раз в минуту
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
